name: Build RaevYoU Admin

on:
  push:
    branches: [main, "raevyou/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Windows application icon
        run: |
          npm install --no-save sharp to-ico
          node -e "const fs=require('fs');const sharp=require('sharp');const toIco=require('to-ico');(async function(){const png=fs.readFileSync('assets/app-icon.png');const pngs=await Promise.all([16,24,32,48,64,128,256].map(size=>sharp(png).resize(size,size).png().toBuffer()));fs.writeFileSync('icon.ico',await toIco(pngs));})().catch(e=>{console.error(e);process.exit(1)});"
      - name: Build Windows packages
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cat > package.json <<'JSON'
          {
            "name": "raevyou-admin-android",
            "version": "2.2.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.raevyou.admin",
            "appName": "RaevYoU Admin",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
      - name: Install and build APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable
          rm -rf android/app/src/main/res/drawable-anydpi-v24
          mkdir -p android/app/src/main/res/drawable-anydpi-v24
          cat > android/app/src/main/res/drawable-anydpi-v24/ic_launcher_foreground.xml <<'XML'
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
            android:src="@drawable/ic_launcher_foreground_custom"
            android:gravity="center" />
          XML
          convert assets/app-icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/app-icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/app-icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/app-icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/app-icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          convert assets/app-icon.png -resize 432x432 android/app/src/main/res/drawable/ic_launcher_foreground.png
          cp android/app/src/main/res/drawable/ic_launcher_foreground.png android/app/src/main/res/drawable/ic_launcher_foreground_custom.png
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <resources><color name="ic_launcher_background">#001D0C</color></resources>
          XML
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
