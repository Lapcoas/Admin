name: Build RaevYoU Admin

on:
  push:
    branches: [main, "raevyou/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows packages
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
          cat > package.json <<'JSON'
          {
            "name": "raevyou-admin-android",
            "version": "2.2.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.raevyou.admin",
            "appName": "RaevYoU Admin",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
      - name: Install and build APK
        run: |
          npm install
          npx cap add android
          npx cap sync android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
