name: Build RaevYoU Admin

on:
  push:
    branches: [main, "raevyou/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows packages
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/
      - name: Install dependencies and prepare Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: RaevYoU-Admin-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
